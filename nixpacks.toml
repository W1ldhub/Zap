# ============================================================
#  ZAP — настройки сборки для Nixpacks (используется в Dokploy)
# ============================================================
#  Nixpacks сам понимает, что проект на Node.js (по файлу
#  package.json), сам ставит Node.js, библиотеки и запускает
#  программу. Поэтому здесь указаны только две вещи.
#
#  ВАЖНО: не нужно переписывать этапы install и setup —
#  если их переопределить, Nixpacks не поставит Node.js,
#  и сборка упадёт с ошибкой "npm: command not found".
# ============================================================

[variables]
# «Рабочий» режим — в итоговый образ попадут только нужные библиотеки.
NODE_ENV = "production"

[start]
# Что запускать после сборки.
cmd = "npm start"
